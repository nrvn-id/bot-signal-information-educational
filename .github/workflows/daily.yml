name: OKX Trend Scanner Bot

on:
  schedule:
    - cron: "0 * * * *"   # tiap jam, di menit ke-0 (UTC)
  workflow_dispatch: {}    # bisa trigger manual dari tab Actions

permissions:
  contents: write   # dibutuhkan supaya job ini boleh commit & push balik ke repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit & push hasil scan (docs/results.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results.json
          git diff --quiet --cached || git commit -m "Update hasil scan [skip ci]"
          git push
