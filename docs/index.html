<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKX Long Setup Scan</title>
<style>
  :root{
    --bg:#0B0E11; --panel:#12151A; --border:#22262D;
    --text:#E8E8E8; --muted:#8A8F98; --green:#3FBF6A; --green-soft:#12271B;
    --amber:#D9A441; --amber-soft:#2A2213; --red:#D9534F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Segoe UI', Inter, sans-serif; padding:18px; max-width:760px; margin:0 auto;}
  .header{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:8px;}
  .title{font-size:19px; font-weight:700;}
  .badge{background:#1B1F26; color:var(--muted); font-size:12px; padding:3px 10px; border-radius:100px; margin-left:8px;}
  .meta{color:var(--muted); font-size:12.5px; margin-bottom:6px;}
  .criteria{color:var(--muted); font-size:11.5px; margin-bottom:18px; line-height:1.6;}
  .refresh-btn{display:flex; align-items:center; gap:6px; background:#1B1F26; border:1px solid var(--border); color:var(--text); padding:6px 14px; border-radius:100px; font-size:12.5px; cursor:pointer;}
  .refresh-btn:hover{border-color:var(--green); color:var(--green);}
  .refresh-btn:disabled{opacity:.5; cursor:default;}
  .refresh-btn .icon{display:inline-block; transition:transform .6s ease;}
  .refresh-btn.spinning .icon{transform:rotate(360deg);}

  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px;}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .pair-name{font-size:16px; font-weight:700;}
  .pair-price{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .score{background:var(--green-soft); color:var(--green); font-size:13px; font-weight:700; padding:4px 10px; border-radius:8px; white-space:nowrap;}

  .tf-line{font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  .tf-line b{color:var(--text);}
  .tf-tag{color:var(--green);}
  .ctx{font-size:12.5px; color:var(--muted); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);}
  .ctx b{color:var(--text);}
  .up{color:var(--green);} .down{color:var(--red);}

  .plan{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:12.5px;}
  .plan-title{color:var(--text); font-weight:600; margin-bottom:6px;}
  .plan-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px 18px; color:var(--muted);}
  .plan-grid b{color:var(--text);}
  .rr-ok{color:var(--green);} .rr-bad{color:var(--amber);}
  .empty, .loading{text-align:center; color:var(--muted); padding:50px 10px; font-size:13.5px;}
</style>
</head>
<body>
  <div class="header">
    <div class="title">📊 OKX Long Setup <span class="badge" id="resultCount">-</span></div>
    <button class="refresh-btn" id="refreshBtn"><span class="icon">🔄</span> Refresh</button>
  </div>
  <div class="meta" id="lastUpdate">Memuat...</div>
  <div class="criteria" id="criteria"></div>
  <div id="results"><div class="loading">Memuat hasil scan terakhir...</div></div>

<script>
  function displayPair(exchange, instId){
    if (exchange === 'OKX') return instId.replace('-USDT-SWAP', '/USDT');
    if (exchange === 'BINANCE') return instId.endsWith('USDT') ? instId.slice(0, -4) + '/USDT' : instId;
    return instId;
  }
  function fmt(v){
    if (v === null || v === undefined) return '-';
    const n = Number(v);
    return n < 1 ? n.toFixed(6).replace(/0+$/,'').replace(/\.$/,'') : n.toLocaleString('en-US',{minimumFractionDigits:4, maximumFractionDigits:4});
  }
  function timeAgo(iso){
    const mins = Math.floor((Date.now() - new Date(iso).getTime())/60000);
    if (mins < 60) return mins + ' menit lalu';
    const h = Math.floor(mins/60);
    return h < 24 ? h + ' jam lalu' : Math.floor(h/24) + ' hari lalu';
  }

  async function load(){
    const btn = document.getElementById('refreshBtn');
    if (btn){ btn.disabled = true; btn.classList.add('spinning'); }
    try{
      const res = await fetch('./results.json?t=' + Date.now());
      const data = await res.json();
      const list = data.candidates || [];

      document.getElementById('resultCount').textContent = list.length + ' lolos / ' + data.total_scanned + ' discan';
      document.getElementById('lastUpdate').textContent = 'Update terakhir: ' + timeAgo(data.generated_at) + ' (' + new Date(data.generated_at).toLocaleString('id-ID') + ')';

      if (data.criteria){
        document.getElementById('criteria').innerHTML =
          'Kunci — ' + data.criteria.key + '<br>Konfirmasi — ' + data.criteria.confirm + '<br>Timing — ' + data.criteria.timing;
      }

      const container = document.getElementById('results');
      if (list.length === 0){
        container.innerHTML = '<div class="empty">Tidak ada setup yang lolos saat scan terakhir. Tidak ada setup juga sebuah informasi.</div>';
        return;
      }

      container.innerHTML = list.map(c => {
        const p = c.plan, oi = c.open_interest || {}, vol = c.volume_4h || {};
        const oiTxt = oi.available
          ? `<span class="${oi.rising ? 'up' : 'down'}">${oi.change_24h_pct > 0 ? '+' : ''}${oi.change_24h_pct}%</span>`
          : 'n/a';
        const divTxt = c.bullish_divergence_4h ? '<br>Terdeteksi bullish divergence 4H <i>(petunjuk lemah)</i>' : '';
        const rrClass = p.rr_healthy ? 'rr-ok' : 'rr-bad';
        const rrWarn = p.rr_healthy ? '' : ' ⚠️ rendah';

        return `
        <div class="card">
          <div class="card-head">
            <div>
              <div class="pair-name"><span class="badge" style="margin:0 6px 0 0">${c.exchange}</span>${displayPair(c.exchange, c.inst_id)} <span style="color:var(--muted); font-weight:400; font-size:11.5px">${(c.categories||[]).join(' / ')}</span></div>
              <div class="pair-price">Harga: ${fmt(c.price)}</div>
            </div>
            <div class="score">${c.rank_score}</div>
          </div>
          <div class="tf-line">4H <span class="tf-tag">${c.key_4h.reasons.join(' + ')}</span> — RSI <b>${c.key_4h.rsi}</b>, StochRSI <b>${c.key_4h.stoch_k}/${c.key_4h.stoch_d}</b></div>
          <div class="tf-line">Struktur 4H: <b>${c.key_4h.structure_trend}</b> — swing high terakhir <b>${fmt(c.key_4h.last_swing_high)}</b></div>
          <div class="tf-line">MACD 4H: <b class="${c.macd_4h.bullish ? 'up' : 'down'}">${c.macd_4h.bullish ? 'bullish' : 'bearish'}</b>${c.macd_4h.cross_recent ? ' (baru cross)' : ''} — histogram <b>${c.macd_4h.histogram}</b> (${c.macd_4h.histogram_rising ? 'naik' : 'turun'})${c.macd_4h.bullish_divergence ? '<br><i>Terdeteksi bullish divergence MACD (petunjuk lemah)</i>' : ''}</div>
          <div class="tf-line">1H konfirmasi — RSI <b>${c.confirm_1h.rsi}</b>, StochRSI <b>${c.confirm_1h.stoch_k}/${c.confirm_1h.stoch_d}</b></div>
          <div class="tf-line">15m timing — <span class="tf-tag">${c.timing_15m.verdict}</span> (K <b>${c.timing_15m.stoch_k}</b>)</div>
          <div class="ctx">Volume 4H: <b>${vol.ratio}x</b> rata-rata &nbsp;|&nbsp; Open Interest 24j: ${oiTxt}${divTxt}</div>
          <div class="plan">
            <div class="plan-title">Jaring entry (Fibonacci 4H)</div>
            <div class="plan-grid">
              <div>E1: <b>${fmt(p.entries[0])}</b></div>
              <div>SL: <b>${fmt(p.sl)}</b></div>
              <div>E2: <b>${fmt(p.entries[1])}</b></div>
              <div>TP1: <b>${fmt(p.tp1)}</b></div>
              <div>E3: <b>${fmt(p.entries[2])}</b></div>
              <div>TP2: <b>${fmt(p.tp2)}</b></div>
              <div>Rata2: <b>${fmt(p.avg_entry)}</b></div>
              <div>TP3: <b>${fmt(p.tp3)}</b></div>
              <div>R:R ke TP1: <b class="${rrClass}">${p.rr_to_tp1}${rrWarn}</b></div>
            </div>
          </div>
        </div>`;
      }).join('');
    }catch(e){
      document.getElementById('results').innerHTML = '<div class="empty">Gagal memuat results.json: ' + e + '</div>';
    }finally{
      if (btn){ btn.disabled = false; setTimeout(()=>btn.classList.remove('spinning'), 400); }
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', load);
  load();
</script>
</body>
</html>
